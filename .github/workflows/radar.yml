name: Study Radar

on:
  schedule:
    # Mondays 06:17 UTC. Change to suit your timezone: https://crontab.guru
    - cron: "17 6 * * 1"
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: study-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find and brief new studies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python radar.py

      - name: Save results
        run: |
          git config user.name  "study-radar[bot]"
          git config user.email "study-radar@users.noreply.github.com"
          git add docs/data.json state/state.json
          git diff --staged --quiet || git commit -m "Radar update $(date -u +%F)"
          git push
