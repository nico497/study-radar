# ------------------------------------------------------------------
# Study Radar config
# Edit the niche, audience and sources. That's all most people need.
# Test your sources any time with:  python radar.py --check
# ------------------------------------------------------------------

title: Study Radar

# Used to tailor every brief's "so what" and post angle.
niche: SEO and generative engine optimization (GEO) for B2B SaaS
audience: the content and SEO lead at a B2B SaaS company

# Optional. If set, briefs can only use these tags (keeps filters tidy).
tags: [ai search, ctr & serps, links, content, technical seo, brand, analytics]

lookback_days: 45        # ignore anything published before this (matters on the first run)
max_briefs_per_run: 12   # spend cap: extra studies wait for the next run

# Triage uses a cheap model to spot studies. Briefs use a stronger one.
models:
  triage: claude-haiku-4-5-20251001
  brief: claude-sonnet-5-5

# ------------------------------------------------------------------
# Sources. Each one needs a name and ONE of:
#   feed:    an RSS/Atom URL (best: gives dates and summaries)
#   page:    a listing page + link_pattern (a regex the post URLs match)
#   sitemap: a sitemap URL + link_pattern
# Optional per source:
#   kind: official         official announcements (e.g. Google): triage keeps real
#                          changes, briefs are framed as updates, not studies
#   all_studies: true      skip triage: brief everything from this source
#   link_pattern: /x/      only keep URLs matching this regex
#   exclude_pattern: /y/   drop URLs matching this regex
#   first_run_keep: 3      for undated pages: how many to brief on the first run
#   focus: "..."           official sources: only keep posts about this topic
# ------------------------------------------------------------------
sources:
  # --- Official: changes straight from Google (kind: official) ---
  - name: Google Search Central
    feed: https://developers.google.com/search/blog/feed.xml
    kind: official

  - name: Google Search Status
    feed: https://status.search.google.com/en/feed.atom
    kind: official
    all_studies: true    # every entry is a ranking/spam/core update

  - name: Bing Webmaster
    feed: https://blogs.bing.com/webmaster/feed
    kind: official

  - name: OpenAI
    feed: https://openai.com/news/rss.xml
    kind: official
    focus: ChatGPT search features, how ChatGPT finds, ranks or cites web sources, OpenAI crawlers (OAI-SearchBot, GPTBot), shopping or ads in ChatGPT, publisher partnerships. NOT model launches, research papers, education, customer stories, policy or company news

  - name: Google Keyword (Search)
    feed: https://blog.google/products-and-platforms/products/search/rss/
    kind: official
    focus: AI Mode, AI Overviews, ranking or Search feature changes that affect publishers and site owners, Search data releases. NOT consumer tips, seasonal trends, Translate, policy or company news

  # --- Research: companies that publish their own data ---
  - name: Ahrefs
    feed: https://ahrefs.com/blog/feed/

  - name: Semrush
    feed: https://www.semrush.com/blog/feed/

  - name: Growth Memo
    feed: https://www.growth-memo.com/feed

  - name: Seer Interactive
    feed: https://www.seerinteractive.com/insights/rss.xml

  - name: Profound
    feed: https://www.tryprofound.com/rss/blog.xml

  - name: Orbit Media
    page: https://www.orbitmedia.com/blog/
    link_pattern: orbitmedia\.com/blog/[a-z0-9-]+/?$
    first_run_keep: 8

  - name: Peec AI
    page: https://peec.ai/blog
    link_pattern: peec\.ai/blog/[^/]+/?$
    first_run_keep: 6

  - name: AirOps
    page: https://www.airops.com/blog
    link_pattern: airops\.com/blog/[^/]+/?$
    first_run_keep: 6

  - name: BrightEdge
    page: https://www.brightedge.com/resources/research-reports
    link_pattern: /resources/research-reports/[a-z0-9-]+/?$
    all_studies: true

  - name: SearchPilot
    page: https://www.searchpilot.com/resources?content_type__in=Tests&sort=-published_date&offset=0
    link_pattern: /resources/case-studies/[a-z0-9-]+/?$
    all_studies: true
    first_run_keep: 6

  - name: SparkToro
    feed: https://sparktoro.com/blog/feed/

  - name: Amsive
    feed: https://www.amsive.com/feed/
    exclude_pattern: /webinar

  - name: Cloudflare
    feed: https://blog.cloudflare.com/tag/ai-bots/rss/
