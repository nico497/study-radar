<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Radar</title>
<meta name="description" content="What matters in your niche this week, in 60 seconds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23c2410c' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23c2410c' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23c2410c'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --surface-2: #faf8f4; --ink: #1c1b19; --ink-2: #57534e;
  --ink-3: #8a847c; --line: #e6e1d8; --accent: #c2410c; --accent-soft: #fdf0e8;
  --hi: #15803d; --hi-bg: #e9f6ee; --md: #a16207; --md-bg: #fbf3dc; --lo: #b91c1c; --lo-bg: #fcebea;
  --shadow: 0 1px 2px rgba(28,27,25,.05), 0 4px 16px rgba(28,27,25,.04);
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --surface: #1d1c19; --surface-2: #232220; --ink: #f1eee8; --ink-2: #b9b3a9;
    --ink-3: #857f76; --line: #33312d; --accent: #fb923c; --accent-soft: #2c1d13;
    --hi: #4ade80; --hi-bg: #15291c; --md: #fbbf24; --md-bg: #2b2412; --lo: #f87171; --lo-bg: #2e1615;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --surface: #1d1c19; --surface-2: #232220; --ink: #f1eee8; --ink-2: #b9b3a9;
  --ink-3: #857f76; --line: #33312d; --accent: #fb923c; --accent-soft: #2c1d13;
  --hi: #4ade80; --hi-bg: #15291c; --md: #fbbf24; --md-bg: #2b2412; --lo: #f87171; --lo-bg: #2e1615;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }

.banner { background: var(--ink); color: var(--bg); text-align: center; font-size: 13px; padding: 6px 16px; }

.wrap > .pulse:first-child, .wrap > .bar:first-child { margin-top: 24px; }
.pulse { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); }
.pulse-head { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
.pulse-head .ctx { font-size: 12.5px; color: var(--ink-3); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.pulse .summary { font: 500 19px/1.45 var(--serif); margin: 6px 0 14px; }
.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: p; }
.points li { counter-increment: p; display: grid; grid-template-columns: 26px 1fr; gap: 4px; }
.points li::before { content: counter(p); width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 2px; }
.chip { display: inline-block; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin: 3px 4px 0 0; text-decoration: none; background: var(--surface-2); }
.chip:hover { border-color: var(--ink-3); }
.pulse-foot { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.pulse-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
.pulse-foot .bad { color: var(--lo); }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; margin-top: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; color: var(--ink-2); white-space: nowrap; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs .n { opacity: .65; margin-left: 5px; font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters input, .filters select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 13.5px; color: var(--ink); min-width: 0; }
.filters input { width: 150px; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13.5px; }

main { padding: 14px 0 32px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 12px; padding: 14px 18px; outline: none; }
.card.imp-3 { border-left-color: var(--accent); }
.card.imp-1 .headline { color: var(--ink-2); }
.card.focus { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.meta .src { color: var(--ink); font-weight: 600; }
.tag { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.tag.must { background: var(--accent); color: #fff; }
.tag.minor { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
.tag.warn { background: var(--md-bg); color: var(--md); }
.tag.new { color: var(--accent); padding: 0; }
.headline { font: 600 17.5px/1.35 var(--serif); margin: 5px 0 3px; letter-spacing: -.005em; }
.why { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.conf { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.conf i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.conf.official i { background: var(--ink); border-radius: 2px; }
.conf.high i { background: var(--hi); } .conf.medium i { background: var(--md); } .conf.low i { background: var(--lo); }
.conf b { font-weight: 600; color: var(--ink); }
.actions { display: flex; gap: 6px; }
.actions button { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 8px; font-size: 13px; }
.actions button:hover { border-color: var(--ink-3); }
.actions button.save.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.actions kbd { font: 11px var(--sans); color: var(--ink-3); margin-left: 4px; }
.actions button.on kbd { color: inherit; opacity: .6; }
.card.saved { border-left-color: var(--accent); }
.actions .more { color: var(--ink-2); border-color: transparent; background: none; }
.details { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 12px; font-size: 14px; }
.details h4 { margin: 0 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.details ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.mgrid { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
.mgrid dt { color: var(--ink-3); } .mgrid dd { margin: 0; }
.caveat { margin: 6px 0 0; color: var(--ink-2); }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; }
.links a { color: var(--accent); text-decoration: none; } .links a:hover { text-decoration: underline; }
.links button { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13.5px; }

.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty h2 { font: 600 19px var(--serif); color: var(--ink); margin: 0 0 6px; }
details.health { margin: 0 0 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
details.health summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details.health summary .sub { font-weight: 400; color: var(--ink-3); margin-left: 6px; }
.htable { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
.htable th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
.htable td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); }
.htable .num { text-align: right; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--hi); }
.dot.bad { background: var(--lo); }
.hint { color: var(--ink-3); font-size: 12.5px; text-align: center; padding-bottom: 28px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 640px) {
  .bar { position: static; }
  .filters { width: 100%; }
  .filters input { flex: 1 1 100%; width: auto; }
  .pulse { padding: 16px; } .pulse .summary { font-size: 17px; }
  .card { padding: 13px 14px; }
  .actions kbd, .hint { display: none; }
  .htable .hide-sm { display: none; }
}
</style>
</head>
<body>
<div class="banner" id="banner" hidden></div>
<div class="wrap">

  <section class="pulse" id="pulse" hidden></section>

  <div class="bar">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="filters">
      <input id="q" type="search" placeholder="Search" aria-label="Search">
      <select id="source" aria-label="Source"><option value="">All sources</option></select>
      <select id="conf" aria-label="Confidence">
        <option value="">Any confidence</option>
        <option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option><option value="official">Official updates</option>
      </select>
      <button class="ghost" id="copyAll" hidden>Copy all</button>
    </div>
  </div>

  <main id="list" aria-live="polite"></main>

  <details class="health" id="health"></details>
  <p class="hint"><b>j</b>/<b>k</b> move · <b>enter</b> details · <b>s</b> save · <b>o</b> open source</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const KEY = "study-radar:saved:v1";
  const TABS = [["week", "This week"], ["saved", "Saved"], ["all", "All studies"]];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (s, y) => s ? new Date(s).toLocaleDateString(undefined, { day: "numeric", month: "short", ...(y ? { year: "numeric" } : {}) }) : "";
  const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : "Unknown";

  let data = { meta: {}, briefs: [], health: [], pulses: [] };
  let saved = {}, open = new Set(), tab = "week", focusIdx = -1, visible = [];

  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
  const isSaved = (b) => !!saved[b.id];
  const imp = (b) => b.brief?.importance || 2;
  const WEEK = 6.5 * 864e5;
  const isNew = (b) => !!data.meta.updated && !!b.found && new Date(b.found) >= new Date(data.meta.updated) - WEEK;

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1500);
  }
  async function copy(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg); } catch (e) { toast("Copy blocked by the browser"); }
  }
  function markdown(b) {
    const x = b.brief;
    if (!x) return `${b.title} (${b.source}): couldn't be read. ${b.url}`;
    const m = x.method || {};
    return [`**${x.headline}**`, x.why_it_matters, ...(x.key_stats || []).map((s) => `- ${s}`),
      `Method: ${m.sample}; ${m.data_source}. Confidence: ${m.confidence}. ${m.caveat}`,
      `Source: ${b.source}, ${b.title} ${b.url}`].join("\n");
  }
  function toggleSave(id) {
    if (saved[id]) delete saved[id]; else saved[id] = new Date().toISOString();
    persist(); render(true); toast(saved[id] ? "Saved" : "Removed from saved");
  }

  function renderPulse() {
    const p = (data.pulses || [])[0], el = $("#pulse");
    if (!p) { el.hidden = true; return; }
    el.hidden = false;
    const run = data.meta.run || {};
    const byId = (ids) => (ids || []).map((id) => data.briefs.find((b) => b.id === id)).filter(Boolean);
    const must = data.briefs.filter((b) => isNew(b) && imp(b) === 3).length;
    const failing = (data.health || []).filter((h) => !h.ok).length;
    const ctx = data.meta.niche || "";
    el.innerHTML = `<div class="pulse-head"><span class="eyebrow">This week · ${esc(fmtDate(p.date))}</span><span class="ctx">${esc(ctx)}</span></div>
      <p class="summary">${esc(p.summary)}</p>
      ${p.points?.length ? `<ol class="points">${p.points.map((pt) => `<li><div>${esc(pt.text)}<br>${byId(pt.ids).map((b) => `<a class="chip" href="#${esc(b.id)}" data-jump="${esc(b.id)}">${esc(b.source)} ↓</a>`).join("")}</div></li>`).join("")}</ol>` : ""}
      <div class="pulse-foot"><span><b>${data.briefs.filter((b) => isNew(b) && b.brief).length}</b> new studies</span><span><b>${must}</b> must-know</span><span><b>${(data.health || []).length}</b> sources</span>
      ${failing ? `<span class="bad">${failing} source${failing > 1 ? "s" : ""} failing</span>` : ""}</div>`;
  }

  function renderTabs() {
    const c = { week: data.briefs.filter(isNew).length, saved: data.briefs.filter(isSaved).length, all: data.briefs.length };
    $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${k === tab}">${k === "saved" ? "★ " : ""}${l}<span class="n">${c[k]}</span></button>`).join("");
  }

  function filtered() {
    const q = $("#q").value.trim().toLowerCase(), src = $("#source").value, conf = $("#conf").value;
    return data.briefs.filter((b) => {
      if (tab === "week" && !isNew(b)) return false;
      if (tab === "saved" && !isSaved(b)) return false;
      if (src && b.source !== src) return false;
      if (conf === "official" ? b.brief?.study_type !== "official update" : conf && b.brief?.method?.confidence !== conf) return false;
      if (q && !(b.title + " " + b.source + " " + JSON.stringify(b.brief || {})).toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => (isNew(b) - isNew(a)) || imp(b) - imp(a) || (b.published || b.found || "").localeCompare(a.published || a.found || ""));
  }

  function card(b, i) {
    const on = isSaved(b), x = b.brief, m = x?.method || {}, level = imp(b), isOpen = open.has(b.id);
    const date = b.published ? fmtDate(b.published) : `found ${fmtDate(b.found)}`;
    const actions = `<div class="actions">
      ${x ? `<button class="more" data-act="toggle" data-id="${esc(b.id)}" aria-expanded="${isOpen}">${isOpen ? "Less ▴" : "Details ▾"}</button>` : ""}
      <button data-act="save" data-id="${esc(b.id)}" class="save ${on ? "on" : ""}" aria-pressed="${on}">${on ? "★ Saved" : "☆ Save"}<kbd>s</kbd></button></div>`;
    const meta = `<div class="meta">
      ${level === 3 && x ? '<span class="tag must">Must know</span>' : level === 1 && x ? '<span class="tag minor">Minor</span>' : ""}
      <span class="src">${esc(b.source)}</span><span>${esc(date)}</span>${x ? `<span>${esc(x.study_type)}</span>` : ""}
      ${b.gated ? '<span class="tag warn" title="Full report is behind a form. This covers the visible summary only.">Gated</span>' : ""}
      ${isNew(b) && tab !== "week" ? '<span class="tag new">● New</span>' : ""}</div>`;

    if (!x) {
      return `<article class="card" id="${esc(b.id)}" data-i="${i}">${meta}
        <h2 class="headline">${esc(b.title)}</h2>
        <p class="why">Couldn't read this page (${esc(b.unreadable)}). It looks like a study, so it may be worth a click.</p>
        <div class="row"><div class="links"><a href="${esc(b.url)}" target="_blank" rel="noopener">Open source ↗</a></div>${actions}</div></article>`;
    }
    const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
    const official = x.study_type === "official update";
    const sample = m.sample && m.sample !== "Not disclosed" ? ` · ${esc(m.sample)}` : " · sample not disclosed";
    const confLine = official
      ? `<span class="conf official" title="${esc(m.caveat)}"><i></i><span><b>Official update</b>${m.timeframe && !/not disclosed/i.test(m.timeframe) ? ` · ${esc(m.timeframe)}` : ""}</span></span>`
      : `<span class="conf ${esc(m.confidence)}" title="${esc(m.caveat)}"><i></i><span><b>${esc(cap(m.confidence))} confidence</b>${sample}</span></span>`;
    return `<article class="card imp-${level}${on ? " saved" : ""}" id="${esc(b.id)}" data-i="${i}">${meta}
      <h2 class="headline">${esc(x.headline)}</h2>
      <p class="why">${esc(x.why_it_matters)}</p>
      <div class="row">
        ${confLine}
        ${actions}
      </div>
      ${isOpen ? `<div class="details">
        ${(x.key_stats || []).length ? `<div><h4>Key numbers</h4><ul>${x.key_stats.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
        <div><h4>${official ? "What's confirmed" : "Method check"}</h4><dl class="mgrid">${official ? "" : row("Sample", m.sample) + row("Data", m.data_source)}${row("When", m.timeframe)}${row(official ? "Not said" : "Bias", m.conflict)}</dl>
          ${m.caveat ? `<p class="caveat">Careful: ${esc(m.caveat)}</p>` : ""}</div>
        <div class="links"><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)} ↗</a>
          ${(b.pdf_links || []).map((p, n) => `<a href="${esc(p)}" target="_blank" rel="noopener">PDF ${n + 1} ↗</a>`).join("")}
          <button data-act="copy" data-id="${esc(b.id)}">Copy brief</button></div>
      </div>` : ""}
    </article>`;
  }

  function emptyState() {
    if (!data.briefs.length) return `<div class="empty"><h2>No briefs yet</h2><p>Run the workflow once: <b>Actions → Study Radar → Run workflow</b>, then refresh.</p></div>`;
    const msg = { week: "No new studies in the last run. That's a result too: nothing you missed.", saved: "Nothing saved yet. Press <b>☆ Save</b> (or <b>s</b>) on a study worth keeping." }[tab] || "Nothing matches these filters.";
    return `<div class="empty"><h2>${tab === "week" ? "Quiet week" : "Nothing here"}</h2><p>${msg}</p></div>`;
  }

  function render(keepFocus) {
    renderTabs();
    visible = filtered();
    $("#list").innerHTML = visible.length ? visible.map(card).join("") : emptyState();
    $("#copyAll").hidden = tab !== "saved" || !visible.length;
    if (!keepFocus) focusIdx = -1;
    focusIdx = Math.min(focusIdx, visible.length - 1);
    if (focusIdx >= 0) setFocus(focusIdx, false);
  }
  function setFocus(i, scroll = true) {
    document.querySelectorAll(".card").forEach((c) => c.classList.remove("focus"));
    const c = document.querySelectorAll(".card")[i]; if (!c) return;
    focusIdx = i; c.classList.add("focus");
    if (scroll) c.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function renderHealth() {
    const h = data.health || [];
    if (!h.length) { $("#health").hidden = true; return; }
    const bad = h.filter((x) => !x.ok).length;
    $("#health").innerHTML = `<summary>Sources<span class="sub">${h.length - bad} of ${h.length} OK${bad ? ` · ${bad} failing` : ""}</span></summary>
      <table class="htable"><thead><tr><th>Source</th><th>Status</th><th class="num hide-sm">Posts</th><th class="num">New</th></tr></thead><tbody>
      ${h.map((x) => `<tr><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a></td>
        <td><span class="dot ${x.ok ? "" : "bad"}"></span>${x.ok ? "OK" : esc(x.error)}</td>
        <td class="num hide-sm">${x.found ?? ""}</td><td class="num">${x.new ?? ""}</td></tr>`).join("")}</tbody></table>`;
  }

  // A fresh copy of the template still carries the original owner's data until
  // its first run. On *.github.io, hide data that belongs to a different repo.
  function belongsHere(m) {
    const host = location.hostname.toLowerCase();
    if (!m.repo || !host.endsWith(".github.io")) return true;
    const owner = host.replace(/\.github\.io$/, "");
    const first = location.pathname.split("/").filter(Boolean)[0] || "";
    const here = first ? `${owner}/${first}` : `${owner}/${owner}.github.io`;
    return here === m.repo.toLowerCase();
  }

  function hydrate() {
    if (!belongsHere(data.meta || {})) data = { meta: {}, briefs: [], health: [], pulses: [] };
    const m = data.meta || {};
    if (m.banner) { $("#banner").hidden = false; $("#banner").textContent = m.banner; }
    if (m.title) document.title = m.title;
    [...new Set(data.briefs.map((b) => b.source))].sort().forEach((v) => {
      const o = document.createElement("option"); o.value = v; o.textContent = v; $("#source").appendChild(o);
    });
    renderPulse(); renderHealth(); render();
  }

  $("#tabs").addEventListener("click", (e) => { const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; render(); } });
  ["#q", "#source", "#conf"].forEach((s) => $(s).addEventListener("input", () => render()));
  $("#pulse").addEventListener("click", (e) => {
    const j = e.target.closest("[data-jump]"); if (!j) return;
    e.preventDefault();
    const target = data.briefs.find((b) => b.id === j.dataset.jump);
    if (target && !visible.includes(target)) tab = "all";
    open.add(j.dataset.jump); render();
    const el = document.getElementById(j.dataset.jump);
    if (el) { setFocus(+el.dataset.i, false); el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  });
  $("#list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const item = data.briefs.find((x) => x.id === b.dataset.id); if (!item) return;
    const c = b.closest(".card"); if (c) focusIdx = +c.dataset.i;
    if (b.dataset.act === "copy") return copy(markdown(item), "Brief copied");
    if (b.dataset.act === "toggle") { open.has(item.id) ? open.delete(item.id) : open.add(item.id); return render(true); }
    if (b.dataset.act === "save") toggleSave(item.id);
  });
  $("#copyAll").addEventListener("click", () => copy(visible.map(markdown).join("\n\n---\n\n"), `${visible.length} briefs copied`));
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea, button, a") && e.key === "Enter") return;
    if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === "j") return setFocus(Math.min(focusIdx + 1, visible.length - 1));
    if (k === "k") return setFocus(Math.max(focusIdx - 1, 0));
    const item = visible[focusIdx]; if (!item) return;
    if (k === "enter") { e.preventDefault(); open.has(item.id) ? open.delete(item.id) : open.add(item.id); render(true); }
    else if (k === "s") toggleSave(item.id);
    else if (k === "o") window.open(item.url, "_blank", "noopener");
    else if (k === "c") copy(markdown(item), "Brief copied");
  });

  if (window.RADAR_DATA) { data = { ...data, ...window.RADAR_DATA }; hydrate(); }
  else fetch("data.json", { cache: "no-store" })
    .then((r) => r.ok ? r.json() : Promise.reject(r.status))
    .then((d) => { data = { ...data, ...d }; hydrate(); })
    .catch(() => hydrate());
})();
</script>
</body>
</html>
